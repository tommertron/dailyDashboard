services:
  dashboard:
    build: .
    ports:
      - "8443:8443"
    environment:
      - TZ=America/Toronto
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "toms-mac-mini.local:192.168.4.242"
    volumes:
      # Config file with API keys
      - ./config.json:/app/config.json:ro
      # Script files
      - ./generate_summary.py:/app/generate_summary.py:ro
      - ./server.py:/app/server.py:ro
      # Data files (read/write for updates)
      - ./calendar.json:/app/calendar.json
      - ./location.json:/app/location.json
      - ./daily-links.json:/app/daily-links.json
      - ./daily-summary.json:/app/daily-summary.json
      - ./money.txt:/app/money.txt
      - ./untaggedLinks.txt:/app/untaggedLinks.txt
      - ./starredLinks.json:/app/starredLinks.json
      - ./sequelEpisodes.json:/app/sequelEpisodes.json
      - ./new_releases.json:/app/new_releases.json
      - ./anyboxStats.json:/app/anyboxStats.json
      - ./readlater.json:/app/readlater.json
      - ./wisdom.json:/app/wisdom.json
      - ./wisdom_history.json:/app/wisdom_history.json
      - ./heater_history.json:/app/heater_history.json
      - ./home_heater_history.json:/app/home_heater_history.json
      - ./heater_rates.json:/app/heater_rates.json:ro
      - ./home_heater_rates.json:/app/home_heater_rates.json:ro
      - ./wisdom:/app/wisdom:ro
      - ./settings.json:/app/settings.json
      # Backup status from backupJobs
      - /mnt/ssd/backupJobs/backup_status.json:/mnt/ssd/backupJobs/backup_status.json:ro
      # HTML files (mount to avoid rebuild)
      - ./index.html:/app/index.html:ro
      - ./lcars.html:/app/lcars.html:ro
      # Themes directory
      - ./themes:/app/themes:ro
      # TLS certificates (Tailscale)
      - ./certs:/app/certs:ro
      # SSH keys for todo refresh (optional)
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped
